name: Build Lattie Mac

# 拉取私有仓库 windword-labs/lattie，构建 mac arm64（Developer ID 签名 + 公证），
# channel=beta（默认）：独立应用「Lattie Beta」（electron-builder.beta.yml），版本 <base>-beta.N，发布为 prerelease
#   beta 的 base = 本仓库最新正式版 tag vX.Y.Z 的下一个 patch；没有正式版 tag 时取源码 apps/desktop/package.json 的 version
# channel=stable：正式版「Lattie」（electron-builder.yml），版本取输入 version（X.Y.Z），tag vX.Y.Z，发布为 latest；tag 已存在则失败
# 版本由 tag / 输入决定，不改 package.json；构建时注入 -c.extraMetadata.version 与 lattie-core 的 LATTIE_VERSION
run-name: Lattie Mac ${{ github.event.client_payload.channel || inputs.channel || 'beta' }} ${{ github.event.client_payload.source_ref || inputs.source_ref || 'main' }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: lattie 源码分支 / tag / SHA
        required: false
        default: main
        type: string
      channel:
        description: 发布通道
        required: false
        default: beta
        type: choice
        options: [beta, stable]
      version:
        description: 正式版版本号 X.Y.Z（channel=stable 时必填）
        required: false
        type: string
      beta:
        description: beta 序号（仅 beta 通道）；留空则自动取下一个
        required: false
        type: string
  repository_dispatch:
    types: [build-mac, build-mac-beta]

permissions:
  contents: write

concurrency:
  group: lattie-mac
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      SOURCE_REF: ${{ github.event.client_payload.source_ref || inputs.source_ref || 'main' }}
      CHANNEL: ${{ github.event.client_payload.channel || inputs.channel || 'beta' }}
      BETA_INPUT: ${{ github.event.client_payload.beta || inputs.beta }}
      VERSION_INPUT: ${{ github.event.client_payload.version || inputs.version }}
      GH_TOKEN: ${{ github.token }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
    steps:
      - name: Check secrets
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          missing=0
          for v in PAT CSC_LINK_BASE64 CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then echo "missing secret: $v" >&2; missing=1; fi
          done
          exit $missing

      - name: Checkout lattie
        uses: actions/checkout@v4
        with:
          repository: windword-labs/lattie
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Resolve version
        id: ver
        working-directory: source
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          case "$CHANNEL" in beta|stable) ;; *) echo "channel must be beta or stable" >&2; exit 1 ;; esac
          if [ "$CHANNEL" = stable ]; then
            [[ "${VERSION_INPUT:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "stable 需要输入 version（X.Y.Z），当前: '${VERSION_INPUT:-}'" >&2; exit 1; }
            VERSION="$VERSION_INPUT"
          else
          # base：最新正式版 tag 的下一个 patch；没有正式版时用 package.json 的 version（去掉后缀）
          LATEST_STABLE="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ -n "$LATEST_STABLE" ]; then
            IFS=. read -r MA MI PA <<< "$LATEST_STABLE"
            BASE="${MA}.${MI}.$((PA + 1))"
          else
            BASE="$(node -p "require('./apps/desktop/package.json').version" | sed -E 's/-.*$//')"
          fi
          if [ -n "${BETA_INPUT:-}" ]; then
            [[ "$BETA_INPUT" =~ ^[1-9][0-9]*$ ]] || { echo "beta must be a positive integer" >&2; exit 1; }
            N="$BETA_INPUT"
          else
            LAST="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
              | sed -nE "s/^v${BASE//./\\.}-beta\.([0-9]+)$/\1/p" | sort -n | tail -1)"
            N=$(( ${LAST:-0} + 1 ))
          fi
          VERSION="${BASE}-beta.${N}"
          fi
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists" >&2
            exit 1
          fi
          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = beta ]; then
            # Lattie Beta 是与正式版并存的独立应用；源码需包含 beta 打包配置
            test -f apps/desktop/electron-builder.beta.yml || { echo "源码缺少 apps/desktop/electron-builder.beta.yml" >&2; exit 1; }
            CONFIG=electron-builder.beta.yml; PREFIX=Lattie-Beta; APP="Lattie Beta.app"; NAME="Lattie Beta"
          else
            CONFIG=electron-builder.yml; PREFIX=Lattie; APP="Lattie.app"; NAME="Lattie"
          fi
          {
            echo "config=$CONFIG"
            echo "prefix=$PREFIX"
            echo "app=$APP"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${NAME} ${VERSION} (${CHANNEL}) from ${SHA}"

      - name: Import signing certificate
        run: |
          set -euo pipefail
          CERT_PATH="${RUNNER_TEMP}/lattie-developer-id.p12"
          KEYCHAIN_NAME="lattie-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${CSC_LINK_BASE64}" | base64 --decode > "${CERT_PATH}"
          security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_NAME}" -P "${CSC_KEY_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          existing="$(security list-keychains -d user | sed 's/"//g')"
          security list-keychains -d user -s "${KEYCHAIN_NAME}" ${existing}
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          rm -f "${CERT_PATH}"
          KEYCHAIN_PATH="${HOME}/Library/Keychains/${KEYCHAIN_NAME}"
          test -f "${KEYCHAIN_PATH}"
          # 不导出 CSC_LINK：让 electron-builder 直接从这个 keychain 找 Developer ID 身份
          echo "CSC_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          security find-identity -v -p codesigning "${KEYCHAIN_NAME}" | sed -E 's/[0-9A-F]{40}/<hash>/'
          # p12 可能含多个签名身份（Apple Development 等）；只接受 Developer ID Application，并显式指定给 electron-builder
          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_NAME}" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          if [ -z "${IDENTITY}" ]; then
            echo "::error::p12 中没有 Developer ID Application 身份，无法公证分发"
            exit 1
          fi
          # electron-builder 的 CSC_NAME 不带 "Developer ID Application: " 前缀
          echo "CSC_NAME=${IDENTITY#Developer ID Application: }" >> "${GITHUB_ENV}"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/apps/core/go.mod
          cache-dependency-path: source/apps/core/go.sum

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      # ffmpeg / ffprobe（LGPL，源码编译约 6 分钟）：按脚本内容缓存产物，命中时脚本发现版本戳一致直接跳过
      - name: Cache ffmpeg
        if: hashFiles('source/apps/desktop/scripts/build-ffmpeg.sh') != ''
        uses: actions/cache@v4
        with:
          path: |
            source/apps/desktop/core-bin/ffmpeg
            source/apps/desktop/core-bin/ffprobe
            source/apps/desktop/core-bin/ffmpeg.version
          key: ffmpeg-macos-arm64-${{ hashFiles('source/apps/desktop/scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: hashFiles('source/apps/desktop/scripts/build-ffmpeg.sh') != ''
        working-directory: source/apps/desktop
        run: |
          set -euo pipefail
          bash scripts/build-ffmpeg.sh
          ./core-bin/ffmpeg -hide_banner -encoders | grep -q h264_videotoolbox

      - name: Build, sign and notarize
        working-directory: source/apps/desktop
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CONFIG: ${{ steps.ver.outputs.config }}
          SHORT_SHA: ${{ steps.ver.outputs.short_sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm exec electron-vite build
          # Go 核心：写入 core-bin/lattie-core，由 extraResources 打进 Contents/Resources/bin，electron-builder 一并签名
          LATTIE_VERSION="${VERSION}" LATTIE_COMMIT="${SHORT_SHA}" GOOS=darwin GOARCH=arm64 node scripts/build-core.mjs
          test "$(./core-bin/lattie-core --version | grep -c -- "${VERSION}")" -ge 1
          # beta 构建写入 publish.channel=beta：生成 beta-mac.yml，且 app-update.yml 带 channel: beta
          # stable 不设 channel：生成 latest-mac.yml
          EXTRA=()
          if [ "$CHANNEL" = beta ]; then EXTRA+=(-c.publish.channel=beta); fi
          pnpm exec electron-builder --mac --arm64 --publish never --config "${CONFIG}" \
            -c.extraMetadata.version="${VERSION}" ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Collect artifacts
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PREFIX: ${{ steps.ver.outputs.prefix }}
        run: |
          set -euo pipefail
          mkdir -p out
          D="source/apps/desktop/dist"
          cp "$D/${PREFIX}-${VERSION}-arm64.dmg" "$D/${PREFIX}-${VERSION}-arm64.zip" \
             "$D/${PREFIX}-${VERSION}-arm64.zip.blockmap" "$D/${PREFIX}-${VERSION}-arm64.dmg.blockmap" out/
          if [ "$CHANNEL" = beta ]; then YML=beta-mac.yml; else YML=latest-mac.yml; fi
          cp "$D/$YML" out/
          # electron-updater 按 yml 里的 url 下载附件：必须与实际上传的文件名完全一致
          for f in $(sed -nE 's/^ *(- )?(url|path): (.+)$/\3/p' "out/$YML" | sort -u); do
            test -f "out/$f" || { echo "yml 引用的 $f 不在附件中" >&2; exit 1; }
          done
          grep -q "^version: ${VERSION}$" "out/$YML"
          (cd out && shasum -a 256 *.dmg *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Verify signature and notarization
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PREFIX: ${{ steps.ver.outputs.prefix }}
          APP: ${{ steps.ver.outputs.app }}
        run: |
          set -euo pipefail
          # electron-builder 只公证并 staple .app（dmg/zip 内的 app 已带票据）；dmg 本身不单独公证
          mkdir -p chk && ditto -x -k "out/${PREFIX}-${VERSION}-arm64.zip" chk
          xcrun stapler validate "chk/${APP}"
          codesign --verify --deep --strict --verbose=2 "chk/${APP}"
          spctl -a -t exec -vv "chk/${APP}"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "chk/${APP}/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "chk/${APP}/Contents/Info.plist")" = "${VERSION}"
          # Go 核心：已签名（Developer ID + hardened runtime）且版本正确
          CORE="chk/${APP}/Contents/Resources/bin/lattie-core"
          codesign --verify --strict --verbose=2 "$CORE"
          codesign -dv --verbose=2 "$CORE" 2>&1 | tee core-sign.txt
          grep -q "Authority=Developer ID Application" core-sign.txt
          grep -Eq "flags=.*runtime" core-sign.txt
          "$CORE" --version
          "$CORE" --version | grep -q -- "${VERSION}"

      - name: Publish release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then KIND="正式版"; FLAGS=(--latest); else KIND="测试预发布版"; FLAGS=(--prerelease --latest=false); fi
          NOTES="${NAME} ${VERSION}（${KIND}）
          - macOS Apple 芯片（arm64），Developer ID 签名并公证
          - 源码：windword-labs/lattie@${SHA} (${SOURCE_REF})"
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            "${FLAGS[@]}" --title "${NAME} ${VERSION}" --notes "$NOTES" \
            out/*.dmg out/*.zip out/*.blockmap out/*-mac.yml out/SHA256SUMS

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain lattie-signing.keychain-db 2>/dev/null || true
